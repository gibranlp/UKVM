name: Native platform checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-platforms.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
  pull_request:
    paths:
      - '.github/workflows/native-platforms.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build_options: '--features ukvm/bundled-jpeg'
            test_packages: '--workspace'
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            build_options: ''
            test_packages: '-p ukvm-core -p ukvm-protocol -p ukvm-config -p ukvm-platform -p ukvm-runtime'
          - runner: macos-14
            target: aarch64-apple-darwin
            build_options: ''
            test_packages: '-p ukvm-core -p ukvm-protocol -p ukvm-config -p ukvm-platform -p ukvm-runtime'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TURBOJPEG_SOURCE: vendor
      TURBOJPEG_STATIC: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config libpipewire-0.3-dev libwayland-dev libxkbcommon-dev cmake nasm
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add ${{ matrix.target }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check native workspace
        run: cargo check --locked --workspace --all-targets --target ${{ matrix.target }} ${{ matrix.build_options }}
      # Native input/storage are not implemented yet. Compile every test, but
      # execute portable policy/session tests until native state durability and
      # private storage have their own implementation and acceptance.
      - name: Compile every workspace test
        run: cargo test --locked --workspace --no-run --target ${{ matrix.target }} ${{ matrix.build_options }}
      - name: Run applicable tests
        run: cargo test --locked ${{ matrix.test_packages }} --target ${{ matrix.target }} ${{ matrix.build_options }}
      - name: Lint native targets
        run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} ${{ matrix.build_options }} -- -D warnings
      - name: Build native workspace
        run: cargo build --locked --workspace --target ${{ matrix.target }} ${{ matrix.build_options }}
