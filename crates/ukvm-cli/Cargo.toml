[package]
name = "ukvm"
default-run = "ukvm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
bundled-jpeg = ["ukvm-platform/bundled-jpeg"]

[[bin]]
name = "ukvm"
path = "src/main.rs"

[dependencies]
ukvm-core.workspace = true
ukvm-config.workspace = true
ukvm-runtime.workspace = true
ukvm-discovery.workspace = true
ukvm-network.workspace = true
ukvm-platform.workspace = true
ukvm-protocol.workspace = true
toml = "0.8"
serde_json = "1"

[dependencies.tokio]
version = "1"
features = ["rt", "time", "signal", "net", "io-util", "sync", "macros"]

[dev-dependencies]
tempfile = "3"
zbus = "5.18"
