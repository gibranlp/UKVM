[package]
name = "ukvm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ukvm"
path = "src/main.rs"

[dependencies]
ukvm-config.workspace = true
ukvm-runtime.workspace = true
ukvm-discovery.workspace = true
ukvm-network.workspace = true
ukvm-platform.workspace = true
ukvm-protocol.workspace = true
toml = "0.8"

[dependencies.tokio]
version = "1"
features = ["rt", "time", "signal", "net", "io-util", "sync", "macros"]

[dev-dependencies]
tempfile = "3"
