[package]
name = "ukvm-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ukvm-core.workspace = true
ukvm-config.workspace = true
ukvm-discovery.workspace = true
ukvm-network.workspace = true
ukvm-platform.workspace = true
ukvm-protocol.workspace = true
tokio = { version = "1", features = ["rt", "time", "signal", "net", "sync", "macros"] }

futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
fs2 = "0.4"
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
