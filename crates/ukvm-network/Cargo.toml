[package]
name = "ukvm-network"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bincode = "1.3"
libc = "0.2"
dirs = "6"
fs2 = "0.4"
rcgen = "0.13.2"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
snow = "0.9.6"
toml = "0.8"
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "rt", "macros"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
ukvm-protocol.workspace = true
ukvm-core.workspace = true
x509-parser = "0.18.1"

[target.'cfg(target_os = "windows")'.dependencies]
ukvm-platform.workspace = true

[dev-dependencies]
ukvm-platform.workspace = true
tempfile = "3"
