[package]
name = "ukvm-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ukvm-protocol.workspace = true
ukvm-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "input_capture", "remote_desktop", "screencast"] }
futures-util = "0.3"
reis = { version = "0.7.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time", "signal", "net", "macros", "io-util"] }
zbus = "5.18"
rustix = { version = "1", features = ["net", "process", "param", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
dirs = "6"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
